# mado configuration
# Place this file at: ~/.config/mado/config.toml
# (or $XDG_CONFIG_HOME/mado/config.toml)
#
# Every table and key is optional — unset values fall back to the
# built-in defaults shown below.

[general]
# Re-read open files and the sidebar tree automatically when they
# change on disk, instead of only on the reload key. Equivalent to the
# --watch flag. Useful when another process (an editor, an agent) is
# writing the files you are reading.
watch = false
# Draw ```mermaid code blocks as box-character diagrams in the reader
# view (flowcharts, sequence diagrams, and more). A block that cannot be
# drawn, or is wider than the pane, is shown as source instead.
mermaid = true

[theme]
# Glamour markdown style: "auto", "dark", "light", "dracula", "notty",
# "ascii" — or a path to a custom glamour style JSON file.
style = "auto"
# View mode files open in: "reader" renders markdown as a clean document
# (no ## markers), "source" shows the raw markdown syntax.
default_mode = "reader"
# Chroma style for source mode and non-markdown files ("monokai",
# "github", "dracula", …). Unset = chosen automatically from `style`.
# source_style = "monokai"
# UI colors (hex or ANSI 0-255).
accent_color = "#7C6AEF"   # focused borders, active tab, selection
border_color = "#585B70"   # unfocused pane borders
dir_color = "#89B4FA"      # directory names in the sidebar
file_color = "#FFFFFF"     # openable (text) files in the sidebar; known
                           # binary files (png, zip, …) are dimmed instead
selection_fg = "#1E1E2E"
selection_bg = "#7C6AEF"
status_fg = "#CDD6F4"
status_bg = "#313244"

[sidebar]
width = 32            # columns (clamped to half the terminal width)
show_all_files = false # false = only markdown files are listed
show_hidden = false    # show dotfiles / dot-directories

[search]
# Files and directories the search panel leaves out, as glob patterns.
# A pattern without a slash matches a name at any depth ("node_modules"
# skips that directory wherever it is, "*.log" every log file); one
# with a slash matches a path relative to the root ("docs/drafts").
# Setting this key replaces the default list; exclude = [] searches
# everything. The search otherwise follows the sidebar's filter:
# markdown only unless all files are shown, no dotfiles unless
# show_hidden is on.
exclude = ["node_modules", ".git", "vendor", "dist", "build", "target"]

[keys]
# Each action takes a list of keys in bubbletea syntax:
# single characters ("q"), named keys ("enter", "esc", "up", "pgdown",
# "home", "f5"), and modifiers ("ctrl+w", "shift+tab").
quit = ["q", "ctrl+c"]
up = ["up", "k"]
down = ["down", "j"]
open = ["enter", "l"]        # open file / expand-collapse directory
back = ["esc", "h"]          # focus the sidebar
close_tab = ["x", "ctrl+w"]
next_tab = ["tab", "]"]
prev_tab = ["shift+tab", "["]
toggle_sidebar = ["b", "ctrl+b"]
half_page_down = ["ctrl+d", "pgdown"]
half_page_up = ["ctrl+u", "pgup"]
top = ["g", "home"]
bottom = ["G", "end"]
reload = ["r", "f5"]
toggle_mode = ["m"]          # switch reader / source view
toggle_all_files = ["a"]     # show all files / markdown only in sidebar
toggle_line_numbers = ["n"]  # line numbers in source view, like vi's :set nu
search = ["/"]               # find files by name
search_content = ["ctrl+f"]  # find files by content
# Inside the search prompt the keys are fixed: typed characters edit
# the query, tab switches names/contents, up/down (ctrl+p/ctrl+n)
# move, enter opens, esc closes, ctrl+u clears, ctrl+w deletes a word.
settings = [","]             # open the settings panel
# The panel edits every key in this file in place and saves it here;
# comments and ordering are kept. Inside it the keys are fixed: ↑/↓
# (k/j) move, enter / space / ←/→ edit, backspace removes an action's
# last key, esc closes, ctrl+c quits.
help = ["?"]
