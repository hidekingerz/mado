name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The release runs `go mod tidy` as a goreleaser before-hook and
      # then refuses to publish from a dirty tree, so an untidy go.mod
      # or go.sum fails the release rather than the build — on a tag,
      # long after the commit that caused it. Checking here says it on
      # the pull request instead.
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
